name: Test AI-Stock-Scanner
on:
  push:
    branches: [main, feature/v0.5.2-sticky-listed-status]
  pull_request:
    branches: [main, feature/v0.5.2-sticky-listed-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py scan_cli.py stockscanner tests
      - name: PHP syntax check
        run: |
          php -l wordpress/hangar18-ai-stock-scanner/hangar18-ai-stock-scanner.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-github-updater.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-market-quotes.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-portfolio.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-watchlist.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-playbook.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-https-proxy.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-https-proxy.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-portfolio.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-market-quotes.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-fx-rates.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-analysis.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-danish-catalog.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-simulator.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-stock-page.php
          php -l wordpress/hangar18-ai-stock-scanner/includes/class-asc-help.php
      - name: Copenhagen stock directory and CSV import regression
        run: php tests/wp_danish_catalog.php
      - name: Stock page chart smoke test
        run: php tests/wp_stock_chart.php
      - name: DKK conversion and effective purchase FX regression
        run: php tests/wp_portfolio_dkk.php
      - name: WordPress updater reactivation regression
        run: php tests/wp_updater_reactivation.php
      - name: Three consecutive WordPress portfolio purchases
        run: php tests/wp_portfolio_three_purchases.php
      - name: Multi-user playbook visibility and Bear/Base/Bull regression
        run: php tests/wp_playbook_visibility.php
